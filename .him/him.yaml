api_version: him.ai/v1
kind: brain
metadata:
  name: himrobot
  version: 0.1.0
  display_name: himrobot G1 table-tennis policy
  description:
    Humanoid table-tennis policy for HIM Arena on the Unitree G1 (29 DoF). Ships
    the stdio policy server (HoldPolicy fallback, BCPolicy when a checkpoint is
    present) and the Rokoko-mocap-to-G1 retargeting pipeline.
  authors:
    - name: Akbar Sherzod Khamidov
      url: null
  labels:
    domain: table-tennis
    robot: unitree-g1
source:
  type: git
  repository: null
  commit: null
  subdirectory: null
  clean: false
  source_digest: null
entrypoints:
  - id: inference
    purpose: inference
    execution_mode: local_python
    command:
      - python
      - -m
      - him_adapter.server
    working_directory: .
    image_ref: null
    image_digest: null
    runtime_interface_ref: .him/contracts/runtime.json
    process_graph_ref: null
    training_pipeline_ref: null
    endpoint_profile_ref: null
    resource_class: cpu-standard
    network_policy: none
    secret_refs: []
    timeout_seconds: 600
  - id: evaluate
    purpose: evaluation
    execution_mode: python
    command:
      - python
      - -m
      - tt_sim.evaluate
      - --policy
      - tt_sim.policies.param_residual_np:NumpyParamResidualPolicy
      - --trials
      - "10"
      - --video
    working_directory: .
    image_ref: null
    image_digest: null
    runtime_interface_ref: .him/contracts/tt-runtime.json
    process_graph_ref: null
    training_pipeline_ref: null
    endpoint_profile_ref: null
    resource_class: cpu-standard
    network_policy: none
    secret_refs: []
    timeout_seconds: 1800
  - id: evaluate-hitter
    purpose: evaluation
    execution_mode: python
    command:
      - python
      - -m
      - tt_sim.evaluate
      - --policy
      - ik_hitter
      - --trials
      - "10"
      - --video
    working_directory: .
    image_ref: null
    image_digest: null
    runtime_interface_ref: .him/contracts/tt-runtime.json
    process_graph_ref: null
    training_pipeline_ref: null
    endpoint_profile_ref: null
    resource_class: cpu-standard
    network_policy: none
    secret_refs: []
    timeout_seconds: 1800
  - id: train
    purpose: training
    execution_mode: python
    command:
      - python
      - -m
      - tt_sim.rl.ppo
      - --residual
      - --residual-scale
      - "0.2"
      - --vel-penalty
      - "1e-5"
      - --legal-bonus
      - "10"
      - --n-envs
      - "64"
      - --minutes
      - "420"
      - --eval-every-steps
      - "100000"
    working_directory: .
    image_ref: null
    image_digest: null
    runtime_interface_ref: .him/contracts/tt-runtime.json
    process_graph_ref: null
    training_pipeline_ref: null
    endpoint_profile_ref: null
    resource_class: cpu-standard
    network_policy: none
    secret_refs: []
    timeout_seconds: 27000
artifacts: []
contracts:
  runtime_interfaces:
    - .him/contracts/runtime.json
    - .him/contracts/tt-runtime.json
  process_graphs: []
  training_pipelines:
    - contracts/training-pipeline.json
  dataset_manifests: []
  evaluator_manifests: []
tests:
  - id: smoke
    type: smoke
    command:
      - python
      - -m
      - pytest
      - -q
      - .him/tests/test_smoke.py
      - .him/tests/test_server.py
    required_for:
      - push
      - arena
    timeout_seconds: 120
    fixture_ref: .him/fixtures/observation.json
  - id: pipeline-schema
    type: schema
    command:
      - python
      - -m
      - him_sdk.cli
      - pipeline
      - validate
      - .him/contracts/training-pipeline.json
    required_for:
      - push
    timeout_seconds: 60
    fixture_ref: null
  - id: validate-motion-unit
    type: smoke
    command:
      - python
      - -m
      - pytest
      - -q
      - .him/tests/test_validate_motion.py
    required_for:
      - push
    timeout_seconds: 120
    fixture_ref: null
  - id: tt-sim
    type: simulation
    command:
      - python
      - -m
      - pytest
      - -q
      - tt_sim/tests
    required_for:
      - push
      - arena
    timeout_seconds: 300
    fixture_ref: null
compatibility:
  robots: []
  challenges: []
  frameworks:
    - custom-python
    - mujoco
  minimum_him_runtime: 1.0.0
security:
  untrusted_code: true
  requires_sandbox: true
  network_allowlist: []
  hardware_deployment_allowed: false
  signed_by: []
provenance:
  robot_model: google-deepmind/mujoco_menagerie unitree_g1 (BSD-3-Clause)
  retargeting: YanjieZe/GMR (MIT), run from a local venv
  note: Kinematic retargeting only; no policy has been trained yet.
license:
  code: NOASSERTION
  weights: NOASSERTION
  data: NOASSERTION
  commercial_use: unknown
publication:
  visibility: private
  result_trust: him_reproduced
  allow_forks: false
  allow_downloads: false
  redactions: []
extensions: {}
